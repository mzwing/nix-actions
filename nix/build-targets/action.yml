name: Build scheduled targets
description: >-
  Drive the distributed build of every scheduled target, then report what came out and what did not. Writes the realised output paths and the failed target names to files for the steps that follow, and keeps a full build log for an artifact. A builder link that drops mid-build takes every derivation in flight on it down with it, so the fleet is probed while the build runs, a machine that stops answering is evicted at once, and the build reruns without it for as long as builders and budget remain; a dropped link whose builder answers again gets one rerun.

inputs:
  targets:
    description: 'Scheduled targets as JSON: [{name, system, outputPath, ...}].'
    required: true

  file:
    description: Nix file to build; receives BUILD_SYSTEMS with the systems in scope.
    required: false
    default: ci/outputs.nix

  timeout-minutes:
    description: >-
      Self-imposed budget for the whole step, retries included. Must stay well under the runner's 6-hour limit: hitting that limit cancels the job, and cancellation skips every `if: !cancelled()` step after this one, so the push and reconciliation vanish and the run publishes nothing.
    required: false
    default: '200'

  builder-probe-seconds:
    description: >-
      Bound on each builder liveness probe, and the pause between probe rounds while a pass runs. A machine that fails to answer within it is treated as lost and evicted.
    required: false
    default: '30'

  max-silent-seconds:
    description: >-
      Backstop for a build that wedges while its ssh link stays healthy, which the keepalives in builders/attach cannot see. Set far above the silent stretch of the slowest single derivation.
    required: false
    default: '3600'

  build-log:
    description: Full build log, for an upload-artifact step; the job log itself is size-capped and truncates silently.
    required: false
    default: /tmp/nix-build.log

  built-outputs-file:
    description: File to write the realised output paths to.
    required: false
    default: /tmp/built-outputs.txt

  failed-targets-file:
    description: File to write the names of targets that did not build to.
    required: false
    default: /tmp/failed-targets.txt

  lost-builders-file:
    description: >-
      File containing the full hostnames evicted as lost through the final build pass (one per line, empty when none). Pass the same path to store-cache/reconcile.
    required: false
    default: /tmp/lost-builders.txt

runs:
  using: composite
  steps:
    - name: Build scheduled targets
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        BUILD_FILE: ${{ inputs.file }}
        BUILD_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        MAX_SILENT_SECONDS: ${{ inputs.max-silent-seconds }}
        BUILDER_PROBE_SECONDS: ${{ inputs.builder-probe-seconds }}
        BUILD_LOG: ${{ inputs.build-log }}
        BUILT_OUTPUTS_FILE: ${{ inputs.built-outputs-file }}
        FAILED_TARGETS_FILE: ${{ inputs.failed-targets-file }}
        LOST_BUILDERS_FILE: ${{ inputs.lost-builders-file }}
      run: bash ${{ github.action_path }}/build-targets.sh
