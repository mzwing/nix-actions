name: Plan distributed builds
description: >-
  Decide what still needs building and how wide the builder fleet should be. Probes the binary caches for every target's output path, drops the ones already published, and sizes each pool to the work actually scheduled for its system.

outputs:
  targets:
    description: JSON array of targets not found in any probed cache.
    value: ${{ steps.plan.outputs.targets }}

  extra_systems:
    description: JSON array of systems whose extra-outputs group needs rebuilding.
    value: ${{ steps.plan.outputs.extra_systems }}

  builders:
    description: '{"include": [...]} matrix for the builder job.'
    value: ${{ steps.plan.outputs.builders }}

  has_builds:
    description: '"true" if anything needs building.'
    value: ${{ steps.plan.outputs.has_builds }}

inputs:
  targets:
    description: 'Every candidate target as JSON: [{name, system, drvPath, outputPath, outputName?}].'
    required: true

  extra-outputs:
    description: >-
      An optional second group of outputs rebuilt per system as a unit, given as {system: [outputPath]}. A system appears in `extra_systems` when any of its paths is missing. devenv shells are the motivating case: they have no static derivation to schedule, only realised outputs to check.
    required: false
    default: '{}'

  extra-name:
    description: Label for the extra group in log output.
    required: false
    default: extra

  primary-output:
    description: >-
      When targets carry an `outputName`, plan only this one. The others are realised by the same derivation build and reach the private store cache through the post-build hook, but are never published, so probing for them would schedule a perpetual no-op build.
    required: false
    default: out

  builders-file:
    description: Builder pool definitions.
    required: false
    default: .github/builders.json

  probe-caches:
    description: >-
      Space-separated caches to probe. Empty uses the shared essential set, which is the question that matters: could a user fetch this without us rebuilding it?
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Plan distributed builds
      id: plan
      shell: bash
      env:
        ALL_TARGETS: ${{ inputs.targets }}
        EXTRA_OUTPUTS: ${{ inputs.extra-outputs }}
        EXTRA_NAME: ${{ inputs.extra-name }}
        PRIMARY_OUTPUT: ${{ inputs.primary-output }}
        BUILDERS_FILE: ${{ inputs.builders-file }}
        PROBE_CACHES: ${{ inputs.probe-caches }}
      run: bash ${{ github.action_path }}/plan-builds.sh
