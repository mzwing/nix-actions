name: Restore Nix store
description: >-
  Restore the Nix store from the GitHub Actions cache, optionally saving it again post-run, then remove stale root-owned lock files left behind by interrupted builds or substitutions of earlier runs. The lock files ride along in the restored store cache and break the unprivileged tar of the post-run store save; no nix process is running at this point, so any lock file present is stale by definition.

inputs:
  key-prefix:
    description: Cache key family. Everything under it is one generation set, restored by prefix and purged together.
    required: false
    default: nix-ci

  lock-files:
    description: >-
      Files whose names and contents define the key (space-separated). The superset across every consumer, so a repository cannot silently leave one of its own lock files out of the key; the ones it does not have are skipped.
    required: false
    default: flake.lock devenv.lock devenv.nix devenv.yaml nvfetcher.toml go.mod go.sum

  gc-max-store-size-linux:
    description: Maximum store size before the cache is garbage-collected (Linux).
    required: false
    default: 2G

  save:
    description: >-
      Whether to save and purge in the post phase; needs `actions: write`. Exactly one job per repository may write a given key family — concurrent savers race, and the loser's tar is discarded.
    required: false
    default: 'true'

  purge-last-accessed:
    description: >-
      Purge caches in this family last accessed longer ago than this ISO 8601 duration (e.g. P1D). Ignored unless saving.
    required: false
    default: P1D

runs:
  using: composite
  steps:
    - name: Derive store cache key
      id: key
      shell: bash
      env:
        KEY_PREFIX: ${{ inputs.key-prefix }}
        LOCK_FILES: ${{ inputs.lock-files }}
      run: bash ${{ github.action_path }}/key.sh

    - name: Restore Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: ${{ steps.key.outputs.key }}
        restore-prefixes-first-match: ${{ inputs.key-prefix }}-
        gc-max-store-size-linux: ${{ inputs.gc-max-store-size-linux }}
        save: ${{ inputs.save }}
        purge: ${{ inputs.save }}
        purge-prefixes: ${{ inputs.key-prefix }}-
        purge-last-accessed: ${{ inputs.purge-last-accessed }}
        purge-primary-key: never

    - name: Remove stale Nix store lock files
      shell: bash
      run: sudo find /nix/store -maxdepth 1 -name '*.lock' -delete
