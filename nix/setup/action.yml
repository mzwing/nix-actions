name: Set up Nix
description: >-
  Install Nix with the shared substituter configuration plus the repository's own, optionally configure Cachix for pulls and install devenv.

inputs:
  github-token:
    description: >-
      GitHub token for `access-tokens` (private flake inputs). Leave empty to skip.
    required: false
    default: ''

  caches:
    description: >-
      The repository's own binary caches, as plan-builds' `caches` output. Always trusted, substituted from unless substituter-set is "essential", and exported to the job's later steps so the store-cache pruning counts them as public.
    required: false
    default: ''

  substituter-set:
    description: >-
      Which substituters to configure. "essential" leaves out the repository's caches, sparing every cache miss a narinfo round trip per repository cache — worth it on builders, where a cold Rust graph misses thousands of times.
    required: false
    default: all

  max-jobs:
    description: >-
      Value for the max-jobs nix setting (e.g. "0" on coordinators). Leave empty to skip.
    required: false
    default: ''

  cachix-name:
    description: Cachix cache name to configure for pulls.
    required: false
    default: mzwing

  cachix-pull:
    description: Whether to configure Cachix for pulls (skipPush).
    required: false
    default: 'true'

  install-devenv:
    description: Whether to install devenv into the nix profile, trusting its cache.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Assemble Nix configuration
      id: nix-config
      shell: bash
      env:
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        CACHES: ${{ inputs.caches }}
        MAX_JOBS: ${{ inputs.max-jobs }}
        SUBSTITUTER_SET: ${{ inputs.substituter-set }}
        INSTALL_DEVENV: ${{ inputs.install-devenv }}
      run: bash ${{ github.action_path }}/assemble-nix-config.sh

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: ${{ steps.nix-config.outputs.extra_nix_config }}

    - name: Configure Cachix for pulls
      if: inputs.cachix-pull == 'true'
      uses: cachix/cachix-action@v17
      with:
        name: ${{ inputs.cachix-name }}
        skipPush: true

    - name: Install devenv
      if: inputs.install-devenv == 'true'
      shell: bash
      run: nix profile add nixpkgs#devenv
