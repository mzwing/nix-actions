name: Garbage-collect store to build closure
description: >-
  Keep only store paths related to the current lock: register the build-time closure of the given derivations as GC roots, then collect everything else — stale intermediates from previous locks.

inputs:
  drvs-file:
    description: Nix file evaluating to a JSON list of .drv paths.
    required: false
    default: ci/drvs.nix

  gcroots-name:
    description: Directory name under /nix/var/nix/gcroots for the roots.
    required: true

runs:
  using: composite
  steps:
    - name: Garbage-collect stale store paths
      shell: bash
      env:
        DRVS_FILE: ${{ inputs.drvs-file }}
        GCROOTS_NAME: ${{ inputs.gcroots-name }}
      run: bash ${{ github.action_path }}/gc-store.sh
