name: Release remote builders
description: >-
  Signal every builder that the run is over. Intended to run with `if: always()`.

inputs:
  builders-json:
    description: 'Builder matrix JSON ({"include": [{"id", ...}, ...]}).'
    required: true

  builder-prefix:
    description: Hostname prefix of the builders (e.g. nix-b-<run_id>-<attempt>).
    required: true

  timeout-seconds:
    description: How long to keep retrying each best-effort signal.
    required: false
    default: '300'

runs:
  using: composite
  steps:
    - name: Release remote builders
      shell: bash
      env:
        BUILDERS_JSON: ${{ inputs.builders-json }}
        BUILDER_PREFIX: ${{ inputs.builder-prefix }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: bash ${{ github.action_path }}/release.sh
