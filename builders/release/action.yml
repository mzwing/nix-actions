name: Release remote builders
description: >-
  Signal every builder that the run is over, and optionally the store cache host too, so those jobs can shut down cleanly. Intended to run with `if: always()`.

inputs:
  builders-json:
    description: 'Builder matrix JSON ({"include": [{"id", ...}, ...]}).'
    required: true

  builder-prefix:
    description: Hostname prefix of the builders (e.g. nix-b-<run_id>-<attempt>).
    required: true

  cache-host:
    description: Optional store cache hostname; when set it is signalled too.
    required: false
    default: ''

  timeout-seconds:
    description: How long to keep retrying each best-effort signal.
    required: false
    default: '300'

runs:
  using: composite
  steps:
    - name: Release remote builders
      shell: bash
      env:
        BUILDERS_JSON: ${{ inputs.builders-json }}
        BUILDER_PREFIX: ${{ inputs.builder-prefix }}
        CACHE_HOST: ${{ inputs.cache-host }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: ${{ github.action_path }}/release.sh
