name: Connect to builder store cache
description: >-
  Point this machine at the run's Attic cache. Builders also install a post-build hook and an upload drainer; the coordinator configures the substituter side only.

inputs:
  cache-host:
    description: Hostname of the store cache node on the tailnet.
    required: true

  cache-name:
    description: Attic cache name.
    required: false
    default: builder

  post-build-hook:
    description: Whether to push locally built paths to Attic. "false" is substituter-only.
    required: false
    default: 'true'

  timeout-seconds:
    description: >-
      How long to wait for the cache to publish bootstrap data. The cache node only publishes it once the whole generation is restored, so this has to stay above store-cache/restore's own cap plus that job's setup — below it, every builder abandons a restore the cache job still considers healthy. check-budget.sh enforces the relation.
      Builders reach this step about a minute before the pull even starts, so that minute is part of the budget and not slack in it.
    required: false
    default: '2700'

runs:
  using: composite
  steps:
    - name: Connect to builder store cache
      shell: bash
      env:
        CACHE_HOST: ${{ inputs.cache-host }}
        CACHE_NAME: ${{ inputs.cache-name }}
        POST_BUILD_HOOK: ${{ inputs.post-build-hook }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: bash ${{ github.action_path }}/connect.sh
