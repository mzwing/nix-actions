name: Push builder store cache
description: >-
  Persist the Attic generation to an rclone remote. The NAR storage is content-addressed and written once, so this uploads only what the run added — the full generation moves only when seeding an empty remote.

inputs:
  remote:
    description: 'rclone destination holding the generation, e.g. onedrive:nix-ci/attic.'
    required: true

  data-dir:
    description: Live Attic data directory.
    required: false
    default: /nix/attic-data

  prune:
    description: >-
      Whether to mirror local deletions, removing objects that shutdown pruning dropped. Mid-run pushes leave this off so a push can only ever add.
    required: false
    default: 'false'

  max-delete:
    description: >-
      Abort the prune rather than delete more than this many objects. Guards against a half-restored local tree mirroring itself over a good remote.
    required: false
    default: '20000'

  transfers:
    description: Concurrent object transfers.
    required: false
    default: '24'

  timeout-minutes:
    description: Cap on the whole push.
    required: false
    default: '60'

  rclone-nixpkgs-rev:
    description: Pinned nixpkgs revision providing a prebuilt rclone.
    required: false
    default: 2fcb964de67fcf60b43471c55d5d99e61a9ccb5a

runs:
  using: composite
  steps:
    - name: Push builder store cache
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        DATA_DIR: ${{ inputs.data-dir }}
        PRUNE: ${{ inputs.prune }}
        MAX_DELETE: ${{ inputs.max-delete }}
        RCLONE_TRANSFERS: ${{ inputs.transfers }}
        RCLONE_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        RCLONE_NIXPKGS_REV: ${{ inputs.rclone-nixpkgs-rev }}
      run: bash ${{ github.action_path }}/push.sh
