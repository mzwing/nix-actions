name: Start Firn uploader
description: Queue built outputs for upload to Firn.
inputs:
  github-token:
    description: GitHub token with packages write access.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Start Firn uploader
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash ${{ github.action_path }}/start.sh
